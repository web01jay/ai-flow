<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jarvis</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              // Apple HIG Primary Colors
              "primary": "#007AFF", // Apple system blue
              "primary-dark": "#0056CC", // Darker blue for better contrast on light backgrounds
              "primary-dim": "rgba(0, 122, 255, 0.1)",
              "secondary": "#5AC8FA", // Apple light blue for secondary actions
              
              // Apple HIG Semantic Colors
              "success": "#34C759", // Apple green for success states
              "success-dark": "#248A3D", // Darker green for better contrast
              "warning": "#FF9500", // Apple orange for warnings
              "warning-dark": "#CC7700", // Darker orange for better contrast
              "error": "#FF3B30", // Apple red for errors
              "error-dark": "#CC2E26", // Darker red for better contrast
              "info": "#007AFF", // Using primary blue for info states
              
              // Background Colors (Apple HIG compliant)
              "background-light": "#F2F2F7", // Apple system background light
              "background-dark": "#000000", // Apple system background dark
              "background-dark-surface": "#1C1C1E", // Apple secondary system background dark
              
              // Surface Colors
              "surface-light": "#FFFFFF", // Apple system background light elevated
              "surface-dark": "#1C1C1E", // Apple secondary system background dark
              "surface-dark-highlight": "#2C2C2E", // Apple tertiary system background dark
              "surface-highlight": "#3A3A3C", // Apple quaternary system background dark
              
              // Card Colors
              "card-light": "#FFFFFF",
              "card-dark": "#1C1C1E",
              
              // Border Colors (Apple HIG compliant contrast)
              "border-light": "#C6C6C8", // Apple separator light
              "border-dark": "#38383A", // Apple separator dark
              
              // Input Colors
              "input-dark": "#2C2C2E",
              "input-placeholder": "#8E8E93", // Apple tertiary label
              "handle-dark": "#48484A",
              
              // Text Colors (Apple HIG label hierarchy)
              "text-primary-light": "#000000", // Apple label light
              "text-primary-dark": "#FFFFFF", // Apple label dark
              "text-secondary-light": "#3C3C43", // Apple secondary label light (60% opacity)
              "text-secondary-dark": "#EBEBF5", // Apple secondary label dark (60% opacity)
              "text-tertiary-light": "#3C3C43", // Apple tertiary label light (30% opacity)
              "text-tertiary-dark": "#EBEBF5" // Apple tertiary label dark (30% opacity)
            },
            fontFamily: {
              "display": ["Spline Sans", "sans-serif"],
              "body": ["Noto Sans", "sans-serif"],
              "inter": ["Inter", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "1rem",
              "lg": "1.5rem",
              "xl": "2rem",
              "2xl": "2.5rem",
              "3xl": "3rem",
              "full": "9999px"
            },
            spacing: {
              "safe-top": "env(safe-area-inset-top, 20px)",
              "safe-bottom": "env(safe-area-inset-bottom, 20px)"
            },
            boxShadow: {
              "glow": "0 0 15px -3px rgba(0, 122, 255, 0.3)", // Updated to use Apple blue
              "glow-hover": "0 0 25px -5px rgba(0, 122, 255, 0.5)", // Updated to use Apple blue
              "subtle": "0 1px 2px 0 rgba(0, 0, 0, 0.05)",
              "float": "0 10px 30px -5px rgba(0, 0, 0, 0.3)"
            },
            animation: {
              "slide-up": "slideUp 0.3s ease-out forwards",
              "fade-in": "fadeIn 0.2s ease-out forwards"
            },
            keyframes: {
              slideUp: {
                "0%": { transform: "translateY(100%)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" }
              },
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" }
              }
            }
          },
        },
      }
    </script>

    <style>
      body {
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .dark .glass-panel {
        background: rgba(28, 28, 30, 0.85); /* Updated to Apple HIG dark background */
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .material-symbols-outlined.filled {
        font-variation-settings: 'FILL' 1;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",
    "react/": "https://esm.sh/react@^19.2.1/",
    "react": "https://esm.sh/react@^19.2.1",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.10.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased selection:bg-primary selection:text-background-dark">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
